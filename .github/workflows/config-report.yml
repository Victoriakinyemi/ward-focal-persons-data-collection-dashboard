name: Config Report

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate config report
        run: |
          echo "Config Report - $(date)" > config-report.txt
          echo "----------------------------" >> config-report.txt
          cat config.json >> config-report.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: config-report
          path: config-report.txt
